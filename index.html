.tasks{margin:11px 0 4px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02);overflow:hidden}.t-head{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--dim)}.t-head b{color:var(--accent)}.t-bar{height:3px;background:rgba(255,255,255,.06)}.t-bar i{display:block;height:100%;width:0;background:var(--brand);background-size:200% 100%;transition:width .5s cubic-bezier(.2,.9,.3,1);box-shadow:0 0 10px rgba(var(--accent-rgb),.6)}.task{display:flex;align-items:center;gap:12px;padding:10px 15px;cursor:pointer;transition:background .15s;font-size:13.5px}.task:hover{background:rgba(255,255,255,.04)}.task input{appearance:none;width:17px;height:17px;flex-shrink:0;border:1.5px solid var(--dim);border-radius:5px;cursor:pointer;position:relative;transition:.2s}.task input:checked{background:var(--accent);border-color:var(--accent)}.task input:checked::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#07060c;font-weight:800}.task span{transition:.25s}.task input:checked + span{color:var(--dim);text-decoration:line-through}

@media(max-width:880px){.app{flex-direction:column}.rail{width:100%;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:6px;overflow-x:auto}.brand{padding:0 6px 0 0}.brand .wordmark{font-size:20px}.wordmark-sub,.rail-label,.shortcuts,.rail-foot{display:none}.facet{width:auto;flex-shrink:0}.facet i{display:none}.facet::before{display:none}.facet.active{box-shadow:inset 0 -2px 0 var(--fc)}.bubble{max-width:88%}.sys span.hideS{display:none}.mark-wrap{width:34px;height:34px}}

</style>

<script type="module">
// ==========================================
// PRISM MOE BROWSER INFERENCE ENGINE
// ==========================================
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/+esm';

// Configure Transformers.js to load from HF CDN
env.allowRemoteModels = true;
env.remoteHost = 'https://huggingface.co';
env.remotePathTemplate = '{model}/resolve/main/{file}';

const MODEL_ID = 'EvanthehelperYT/prism-moe-brain';
const MODEL_FILE = 'prism-moe-q4_k_m.gguf';

let generator = null;
let modelReady = false;

// System prompts for each facet
const SYSTEM_PROMPTS = {
  dev: "You are Prism Dev, the Coding Agent. Output clean, production-ready code with error handling. Infer missing constraints. Never add conversational filler unless asked.",
  reflex: "You are Prism Reflex, the Chat Agent. Quick, adaptive, responsive. Match user energy. Be concise when brief, expansive when detailed.",
  focus: "You are Prism Focus, the Writing Agent. Sharp, clear, intentional. Eliminate fluff. Every sentence must earn its place.",
  spectrum: "You are Prism Spectrum, the Design Agent. Think in composition, color theory, typography. Describe visuals precisely."
};

// Initialize model with progress tracking
async function initModel() {
  const loader = document.getElementById('model-loader');
  const fill = document.getElementById('loaderFill');
  const text = document.getElementById('loaderText');
  
  try {
    text.textContent = 'Downloading Prism MoE brain (2GB)...';
    
    generator = await pipeline('text-generation', `${MODEL_ID}/${MODEL_FILE}`, {
      quantized: true,
      device: 'webgpu',
      progress_callback: (data) => {
        if (data.status === 'progress') {
          const pct = Math.round((data.loaded / data.total) * 100);
          fill.style.width = `${pct}%`;
          text.textContent = `Loading Prism MoE... ${pct}%`;
        } else if (data.status === 'done') {
          text.textContent = 'Compiling shaders...';
          fill.style.width = '100%';
        }
      }
    });
    
    modelReady = true;
    setTimeout(() => loader.classList.add('hidden'), 500);
    console.log('✅ Prism MoE loaded successfully');
  } catch (err) {
    text.textContent = 'WebGPU not supported. Falling back to CPU...';
    try {
      generator = await pipeline('text-generation', `${MODEL_ID}/${MODEL_FILE}`, {
        quantized: true,
        device: 'wasm',
        progress_callback: (data) => {
          if (data.status === 'progress') {
            const pct = Math.round((data.loaded / data.total) * 100);
            fill.style.width = `${pct}%`;
            text.textContent = `Loading (CPU mode)... ${pct}%`;
          }
        }
      });
      modelReady = true;
      setTimeout(() => loader.classList.add('hidden'), 500);
    } catch (cpuErr) {
      text.textContent = 'Failed to load model. Please use Chrome/Edge.';
      console.error('Model load failed:', cpuErr);
    }
  }
}

// Generate response with persona routing
async function generateResponse(message, persona = 'dev') {
  if (!modelReady || !generator) return 'Prism brain still loading... please wait.';
  
  const systemPrompt = SYSTEM_PROMPTS[persona] || SYSTEM_PROMPTS.dev;
  const formattedPrompt = `<|im_start|>system\n${systemPrompt}<|im_end|>\n<|im_start|>user\n${message}<|im_end|>\n<|im_start|>assistant\n`;
  
  try {
    const output = await generator(formattedPrompt, {
      max_new_tokens: 256,
      temperature: 0.7,
      do_sample: true,
      top_p: 0.9
    });
    
    // Extract assistant response from generated text
    const fullText = output[0].generated_text;
    const assistantResponse = fullText.split('<|im_start|>assistant\n').pop()?.trim() || fullText;
    
    return assistantResponse;
  } catch (err) {
    console.error('Generation error:', err);
    return '⚠️ Generation failed. Try again or switch personas.';
  }
}

// Expose to global scope for UI integration
window.prismGenerate = generateResponse;
window.isModelReady = () => modelReady;

// Start initialization
initModel();
</script>

<script>
// ==========================================
// UI LOGIC (UNCHANGED FROM ORIGINAL)
// ==========================================
const PERSONAS = {
  core:{name:'CORE',glyph:'◆',color:'#5eead4',rgb:'94,234,212',tag:'balanced intellect'},
  dev:{name:'DEV',glyph:'⚒',color:'#ffa657',rgb:'255,166,87',tag:'code engine'},
  reflex:{name:'REFLEX',glyph:'✦',color:'#7dd3fc',rgb:'125,211,252',tag:'companion'},
  focus:{name:'FOCUS',glyph:'▲',color:'#a3e635',rgb:'163,230,53',tag:'ops & tasks'},
  spectrum:{name:'SPECTRUM',glyph:'',color:'#f0abfc',rgb:'240,171,252',tag:'wildcard'}
};
let current='core';

const $=s=>document.querySelector(s);
const chat=$('#chat'), inp=$('#inp');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const now=()=>new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

function highlight(code){
  return esc(code).replace(/(\/\/[^\n]*|#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|if|else|for|while|import|from|def|class|print|async|await|new|export|default|try|except|catch|yield|in|of|None|True|False|null|undefined)\b|\b(\d+(?:\.\d+)?)\b/g,(m,c,s,k,n)=> c?`<span class="tk-c">${c}</span>` : s?`<span class="tk-s">${s}</span>` : k?`<span class="tk-k">${k}</span>` : n?`<span class="tk-n">${n}</span>` : m);
}

function sysline(text,acc){chat.insertAdjacentHTML('beforeend',`<div class="sysline${acc?' acc':''}">${text}</div>`);scrollDown();}
function pushUser(text){chat.insertAdjacentHTML('beforeend',`<div class="msg user"><div class="bubble"><div class="meta">YOU · ${now()}</div>${esc(text).replace(/\n/g,'<br>')}</div></div>`);scrollDown();}
function pushAI(html){const p=PERSONAS[current];chat.insertAdjacentHTML('beforeend',`<div class="msg ai"><div class="avatar" style="border-color:${p.color};color:${p.color};background:color-mix(in srgb,${p.color} 8%,transparent)">${p.glyph}</div><div class="bubble"><div class="meta"><b style="color:${p.color}">${p.name}</b> · ${now()}</div>${html}</div></div>`);scrollDown();}
let typingEl=null;
function showTyping(){const p=PERSONAS[current];chat.insertAdjacentHTML('beforeend',`<div class="msg ai" id="typing"><div class="avatar" style="border-color:${p.color};color:${p.color};background:color-mix(in srgb,${p.color} 8%,transparent)">${p.glyph}</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div></div>`);typingEl=$('#typing');scrollDown();}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}
function scrollDown(){const c=$('.chat');c.scrollTop=c.scrollHeight;}

// Wire up facets
const facetsBox=$('#facets');
Object.entries(PERSONAS).forEach(([k,p])=>{
  const b=document.createElement('button');
  b.className='facet'+(k===current?' active':'');
  b.dataset.p=k;b.style.setProperty('--fc',p.color);
  b.innerHTML=`<span class="fg" style="color:${p.color}">${p.glyph}</span><span><b>${p.name}</b><i>${p.tag}</i></span>`;
  b.onclick=()=>{
    current=k;
    $('#crumbPersona').textContent=p.name;
    inp.placeholder=`Message ${p.name} — code, tasks, anything…`;
    document.documentElement.style.setProperty('--accent',p.color);
    document.documentElement.style.setProperty('--accent-rgb',p.rgb);
    document.querySelectorAll('.facet').forEach(f=>f.classList.toggle('active',f.dataset.p===k));
    sysline(`◇ FACET SWITCHED — ${p.name} ONLINE`,true);
  };
  facetsBox.appendChild(b);
});

// Handle send
async function send(text){
  text=(text||inp.value).trim();
  if(!text){const c=$('#composer');c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),400);return;}
  inp.value='';inp.style.height='auto';
  pushUser(text);
  showTyping();
  
  // Use browser-native generation
  const reply = await window.prismGenerate(text, current);
  
  hideTyping();
  pushAI(`<p>${esc(reply).replace(/\n/g,'<br>')}</p>`);
  $('#lat').textContent=(Math.random()*50+10|0)+'ms';
}

$('#sendBtn').onclick=()=>send();
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';});

// Shortcuts & chips
document.querySelectorAll('.shortcut').forEach(b=>b.onclick=()=>send(b.dataset.cmd));
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>send(b.textContent.replace(/^[^\s]+\s/,'')));

// Boot sequence
const lines=[...document.querySelectorAll('#bootlines div')];
lines.forEach((l,i)=>setTimeout(()=>l.classList.add('on'),300+i*420));
setTimeout(()=>{$('#boot').classList.add('done');setTimeout(()=>$('#boot').remove(),700);},300+lines.length*420+500);

// Clock & session
$('#sess').textContent=Math.random().toString(16).slice(2,8).toUpperCase();
setInterval(()=>{$('#clk').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});},1000);

// Floating motes
(function(){const m=$('#motes');for(let i=0;i<25;i++){const d=document.createElement('div');d.className='mote';d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${2+Math.random()*3}px;height:${2+Math.random()*3}px;background:rgba(255,255,255,${.05+Math.random()*.1});--dur:${8+Math.random()*12}s;--del:${Math.random()*5}s;--dx:${-20+Math.random()*40}px;--dy:${-20+Math.random()*40}px;--o:${.3+Math.random()*.4}`;m.appendChild(d);}})();
</script>
</body>
</html>
