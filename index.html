<style>

.dots{display:inline-flex;gap:5px;padding:6px 2px}.dots span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:db 1.2s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes db{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.codeblock{margin:11px 0 4px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#08060e}.cb-head{display:flex;justify-content:space-between;align-items:center;padding:8px 13px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}.copy{background:transparent;border:1px solid var(--line2);color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;padding:3px 10px;border-radius:6px;cursor:pointer;transition:.2s;text-transform:uppercase}.copy:hover{color:var(--accent);border-color:var(--accent)}.codeblock pre{padding:14px 16px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.72}.tk-k{color:#ff7b9c}.tk-s{color:#9be8ff}.tk-c{color:#6c6285;font-style:italic}.tk-n{color:#c4a3ff}

.help{margin:8px 0;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02);padding:14px 16px}.h-title{font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:.22em;color:var(--accent);margin-bottom:11px;font-weight:600}.h-row{display:flex;gap:14px;padding:5px 0;font-size:13px;align-items:baseline}.h-row code{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent);padding:2px 8px;border-radius:5px;white-space:nowrap}
.chips{display:flex;gap:9px;padding:11px 28px 4px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex-shrink:0;padding:8px 15px;border:1px solid var(--line2);border-radius:22px;background:rgba(255,255,255,.02);color:var(--dim);font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:.22s}.chip:hover{border-color:var(--accent);color:var(--text);transform:translateY(-2px);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 22%,transparent)}
.composer{display:flex;gap:12px;padding:14px 28px 22px;align-items:flex-end}.composer-inner{flex:1;display:flex;align-items:flex-end;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line2);border-radius:15px;padding:6px 6px 6px 18px;transition:border-color .25s,box-shadow .25s}.composer-inner:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}.composer.shake .composer-inner{animation:shake .35s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}#inp{flex:1;background:transparent;border:0;outline:0;resize:none;color:var(--text);font-family:'Manrope',sans-serif;font-size:14.5px;line-height:1.5;max-height:120px;padding:8px 0}#inp::placeholder{color:var(--dim2)}#sendBtn{width:44px;height:44px;flex-shrink:0;border:0;border-radius:11px;background:var(--brand);background-size:180% 100%;color:#fff;cursor:pointer;display:grid;place-items:center;transition:.22s;animation:shimmer 7s linear infinite}#sendBtn:hover{box-shadow:0 0 24px rgba(255,45,155,.5),0 0 24px rgba(33,212,253,.4);transform:translateY(-2px)}#sendBtn:active{transform:scale(.9)}
@media(max-width:880px){.app{flex-direction:column}.rail{width:100%;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:6px;overflow-x:auto}.brand{padding:0 6px 0 0}.brand .wordmark{font-size:20px}.wordmark-sub,.rail-label,.shortcuts,.rail-foot{display:none}.facet{width:auto;flex-shrink:0}.facet i{display:none}.facet::before{display:none}.facet.active{box-shadow:inset 0 -2px 0 var(--fc)}.bubble{max-width:88%}.sys span.hideS{display:none}.mark-wrap{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

async function initModel() {
  const loader = document.getElementById('model-loader');
  const fill = document.getElementById('loaderFill');
  const text = document.getElementById('loaderText');
  
  try {
    text.textContent = HUMAN_MESSAGES[0];
    
    generator = await pipeline('text-generation', `${MODEL_ID}/${MODEL_FILE}`, {
      quantized: true,
      device: 'webgpu',
      progress_callback: (data) => {
        if (data.status === 'progress') {
          const pct = Math.round((data.loaded / data.total) * 100);
          fill.style.width = `${pct}%`;
          
          // Update text based on progress percentage
          const msgIndex = Math.min(Math.floor(pct / 20), HUMAN_MESSAGES.length - 1);
          text.textContent = HUMAN_MESSAGES[msgIndex];
        } else if (data.status === 'done') {
          text.textContent = HUMAN_MESSAGES[HUMAN_MESSAGES.length - 1];
          fill.style.width = '100%';
        }
      }
    });
    
    modelReady = true;
    setTimeout(() => loader.classList.add('hidden'), 800);
    console.log('✅ Prism MoE loaded successfully');
  } catch (err) {
    text.textContent = 'WebGPU not supported. Falling back to CPU...';
    try {
      generator = await pipeline('text-generation', `${MODEL_ID}/${MODEL_FILE}`, {
        quantized: true,
        device: 'wasm',
        progress_callback: (data) => {
          if (data.status === 'progress') {
            const pct = Math.round((data.loaded / data.total) * 100);
            fill.style.width = `${pct}%`;
            const msgIndex = Math.min(Math.floor(pct / 20), HUMAN_MESSAGES.length - 1);
            text.textContent = HUMAN_MESSAGES[msgIndex];
          }
        }
      });
      modelReady = true;
      setTimeout(() => loader.classList.add('hidden'), 800);
    } catch (cpuErr) {
      text.textContent = 'Failed to load model. Please use Chrome/Edge.';
      console.error('Model load failed:', cpuErr);
    }
  }
}
